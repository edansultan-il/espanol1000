<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11152a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Español 1000">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Español 1000</title>
<style>
:root{
  --bg:#f5f6fb; --card:#fff; --ink:#1c2340; --muted:#7a819c; --line:#e3e6f0; --navy:#1c2340; --navy-ink:#fff; --cell0:#e9ecf5;
  --teal:#2cc4a8; --teal-d:#1a9a83; --purple:#7b61ff; --purple-d:#5a43d6; --coral:#ff7a59; --coral-d:#d85a3a;
  --yellow:#ffc83d; --yellow-d:#d9a21a; --blue:#3d8bff; --blue-d:#2a68cc; --gray-d:#cdd2e4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11152a; --card:#1a2040; --ink:#f1f3fb; --muted:#9aa2c2; --line:#2b3358; --navy:#f1f3fb; --navy-ink:#11152a; --cell0:#232a4d; --gray-d:#2b3358;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11152a; --card:#1a2040; --ink:#f1f3fb; --muted:#9aa2c2; --line:#2b3358; --navy:#f1f3fb; --navy-ink:#11152a; --cell0:#232a4d; --gray-d:#2b3358;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.view{flex:1;display:flex;flex-direction:column;padding:12px 16px calc(92px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.top h1{margin:0;font-size:27px;letter-spacing:-.5px;font-weight:800}
.top .sub{margin:0;color:var(--muted);font-size:14px;font-weight:600}
.top-actions{display:flex;align-items:center;gap:10px}
.flame{display:flex;align-items:center;gap:5px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 11px;font-weight:800;color:var(--coral)}
.flame svg{width:20px;height:20px;fill:var(--coral);animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
.flame.off{color:var(--muted)}.flame.off svg{fill:var(--muted);animation:none}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.14) rotate(3deg)}}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px;fill:var(--muted)}
.b3{display:block;width:100%;border:0;border-bottom:5px solid var(--bd,#000);background:var(--bgc,#000);color:var(--fg,#fff);border-radius:16px;
  min-height:54px;font-weight:800;font-size:17px;letter-spacing:.4px;text-align:center;padding:12px 16px;text-transform:uppercase;
  transition:transform .08s,border-bottom-width .08s}
.b3:active{transform:translateY(3px);border-bottom-width:2px}
.b3.soft{text-transform:none;letter-spacing:0}
.c-navy{--bgc:var(--navy);--bd:#000;--fg:var(--navy-ink)}
.c-teal{--bgc:var(--teal);--bd:var(--teal-d)}.c-purple{--bgc:var(--purple);--bd:var(--purple-d)}
.c-coral{--bgc:var(--coral);--bd:var(--coral-d)}.c-yellow{--bgc:var(--yellow);--bd:var(--yellow-d);--fg:#4a3300}
.c-blue{--bgc:var(--blue);--bd:var(--blue-d)}
.c-ghost{--bgc:var(--card);--bd:var(--line);--fg:var(--ink);border:2px solid var(--line);border-bottom:5px solid var(--line)}
.hero{background:var(--yellow);border-bottom:6px solid var(--yellow-d);color:#4a3300;border-radius:22px;padding:16px}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hero h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;opacity:.75}
.hero .big{font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1.05;margin:2px 0}
.hero .small{font-size:14px;font-weight:700;opacity:.8}
.goal{position:relative;width:76px;height:76px;flex:none}
.goal svg{width:76px;height:76px;transform:rotate(-90deg)}
.goal b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:900;text-align:center;line-height:1}
.goal b small{display:block;font-size:10px;font-weight:700;opacity:.75;margin-top:2px}
.prog{animation:ringin 1s cubic-bezier(.34,1.2,.64,1) both}
@keyframes ringin{from{stroke-dashoffset:var(--full)}}
.seg{display:flex;background:var(--cell0);border-radius:16px;padding:4px;margin:16px 0 8px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.hint{font-size:14px;color:var(--muted);font-weight:600}
.section-title{margin:22px 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;font-weight:800}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{background:var(--bgc);border-bottom:6px solid var(--bd);border-radius:20px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:152px;color:var(--fg,#fff);
  transition:transform .08s,border-bottom-width .08s;animation:popin .45s cubic-bezier(.34,1.56,.64,1) both}
.lv:nth-child(2){animation-delay:.05s}.lv:nth-child(3){animation-delay:.1s}.lv:nth-child(4){animation-delay:.15s}.lv:nth-child(5){animation-delay:.2s}
@keyframes popin{from{transform:scale(.8);opacity:0}}
.lv:active{transform:translateY(4px);border-bottom-width:2px}
.lv.locked{--bgc:var(--cell0);--bd:var(--gray-d);color:var(--muted)}
.lv .ring{width:50px;height:50px;position:relative}
.lv .ring svg{width:50px;height:50px;transform:rotate(-90deg)}
.lv .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:900}
.lv .nm{font-weight:900;font-size:16px;line-height:1.15}
.lv .ct{font-size:13px;font-weight:700;opacity:.85}
.note{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin-top:14px;font-size:15px;font-weight:600}
.note b{display:block;margin-bottom:2px;font-weight:800}
.note button{margin-top:8px;color:var(--purple);font-weight:800}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs-in{max-width:560px;margin:0 auto;display:flex}
.tabs button{flex:1;min-height:58px;font-size:12px;font-weight:800;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-transform:uppercase;letter-spacing:.5px}
.tabs button.on{color:var(--purple)}
.tabs svg{width:26px;height:26px;fill:currentColor}
/* study */
.study{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;overflow:hidden}
.study-top{display:flex;align-items:center;gap:12px;padding:4px 0 8px}
.bar{flex:1;height:14px;background:var(--cell0);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--teal);border-radius:9px;transition:width .6s cubic-bezier(.34,1.56,.64,1);position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:3px;background:rgba(255,255,255,.35)}
.bar.timer i{transition:width .1s linear;background:var(--coral)}
.left{font-size:14px;font-weight:800;color:var(--muted);min-width:64px;text-align:right}
.combo-wrap{height:34px;display:flex;align-items:center;justify-content:center}
.combo{font-weight:900;font-size:18px;color:var(--purple);opacity:0;transform:scale(.6)}
.stage{flex:1;display:flex;perspective:1000px;min-height:0;position:relative}
.flip{position:absolute;inset:0;transform-style:preserve-3d;cursor:pointer}
.face{position:absolute;inset:0;background:var(--card);border:2px solid var(--line);border-bottom:7px solid var(--line);border-radius:26px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center;
  -webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:auto}
.face.back{transform:rotateY(180deg)}
.chip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--cell0);color:var(--muted)}
.chip.lvl{color:#fff}
.word{font-size:38px;font-weight:900;line-height:1.1;letter-spacing:-.5px;word-break:break-word}
.word.es{color:var(--purple)}
.sub-en{font-size:22px;color:var(--muted);font-weight:700}
.ex{margin-top:4px;padding-top:12px;border-top:2px solid var(--line);width:100%}
.ex .xe{font-size:20px;font-weight:800;line-height:1.3}
.ex .xn{font-size:16px;color:var(--muted);margin-top:4px;font-weight:600}
.spk{width:54px;height:54px;border-radius:50%;background:var(--cell0);display:grid;place-items:center;border-bottom:4px solid var(--gray-d)}
.spk svg{width:24px;height:24px;fill:var(--purple)}
.spk:active{transform:translateY(2px);border-bottom-width:2px}
.spk.big{width:104px;height:104px}.spk.big svg{width:48px;height:48px}
.gw{min-height:92px;padding-top:14px;display:flex;align-items:stretch}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:100%}
.grades.two{grid-template-columns:1fr 1fr}
.grade{min-height:68px;border-radius:16px;border:0;border-bottom:5px solid var(--bd);background:var(--bgc);color:#fff;font-weight:900;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s,border-bottom-width .08s}
.grade:active{transform:translateY(3px);border-bottom-width:2px}
.grade small{font-size:12px;font-weight:700;opacity:.9}
.reveal-hint{width:100%;display:grid;place-items:center;color:var(--muted);font-size:15px;font-weight:700}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
#banners{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.banner{background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:10px 16px;font-weight:800;font-size:15px;max-width:92%;text-align:center;border-bottom:4px solid #000}
.banner small{display:block;font-weight:600;opacity:.8;font-size:12px}
/* done */
.done{align-items:center;justify-content:center;text-align:center;gap:10px;position:relative;overflow:hidden}
.trophy{width:104px;height:104px;border-radius:50%;background:var(--yellow);border-bottom:7px solid var(--yellow-d);display:grid;place-items:center;font-size:44px;font-weight:900;color:#4a3300;animation:trophy .8s cubic-bezier(.34,1.56,.64,1) both}
@keyframes trophy{from{transform:scale(0) rotate(-20deg)}}
.done h2{font-size:30px;margin:8px 0 0;font-weight:900}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin:12px 0}
.stat{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:12px 6px;animation:popin .5s cubic-bezier(.34,1.56,.64,1) both}
.stat:nth-child(2){animation-delay:.1s}.stat:nth-child(3){animation-delay:.2s}
.stat b{display:block;font-size:26px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.earned{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:4px 0 8px}
.earned span{background:var(--purple);color:#fff;border-bottom:3px solid var(--purple-d);border-radius:12px;padding:5px 10px;font-weight:800;font-size:13px}
/* words and trophies */
.search{width:100%;min-height:50px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:38px;padding:0 14px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-size:14px;font-weight:800;color:var(--muted)}
.chips button.on{background:var(--purple);border-color:var(--purple);color:#fff}
.rows{list-style:none;margin:6px 0 0;padding:0}
.row{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 14px;margin-bottom:8px}
.row .r1{display:flex;align-items:center;gap:10px;justify-content:space-between}
.row .es{font-weight:900;font-size:18px}
.row .en{color:var(--muted);font-size:15px;font-weight:600}
.row .dot{width:12px;height:12px;border-radius:50%;background:var(--gray-d);flex:none}
.row .dot.k1{background:var(--coral)}.row .dot.k2{background:var(--yellow)}.row .dot.k3{background:var(--teal)}
.row .exs{display:none;margin-top:8px;padding-top:8px;border-top:2px solid var(--line);font-size:15px;font-weight:700}
.row.open .exs{display:block}
.row .exs .xn{color:var(--muted);font-size:14px;font-weight:600}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tstat{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px}
.tstat b{display:block;font-size:30px;font-weight:900}
.tstat span{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px}
.heat .hd{font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.cell{aspect-ratio:1;border-radius:9px;background:var(--cell0);animation:popin .4s cubic-bezier(.34,1.56,.64,1) both}
.cell.h1{background:#b6f0e3}.cell.h2{background:#5fd9bf}.cell.h3{background:var(--teal)}
.cell.today{outline:3px solid var(--purple);outline-offset:1px}
.cell.future{background:transparent;animation:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:12px 6px;text-align:center}
.badge i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;margin:0 auto 6px;font-style:normal;font-weight:900;font-size:14px;background:var(--cell0);color:var(--muted)}
.badge b{display:block;font-size:12px;line-height:1.15;font-weight:800}
.badge span{font-size:11px;color:var(--muted);font-weight:600;display:block;margin-top:2px}
.badge.got{border-color:var(--purple);border-bottom-color:var(--purple-d)}
.badge.got i{background:var(--yellow);color:#4a3300;animation:trophy .7s cubic-bezier(.34,1.56,.64,1) both}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:sheetin .35s cubic-bezier(.34,1.3,.64,1) both}
@keyframes sheetin{from{transform:translateY(60px);opacity:0}}
.sheet h3{margin:0 0 12px;font-size:22px;font-weight:900}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.set label{font-weight:800}
.set small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:42px;height:42px;border-radius:13px;background:var(--cell0);border-bottom:4px solid var(--gray-d);font-size:22px;font-weight:900}
.step b{min-width:28px;text-align:center;font-weight:900}
.tog{width:56px;height:34px;border-radius:99px;background:var(--cell0);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.tog.on{background:var(--teal)}.tog.on::after{transform:translateX(22px)}
select{font:inherit;font-weight:700;color:var(--ink);background:var(--cell0);border:0;border-radius:12px;min-height:42px;padding:0 10px}
textarea{width:100%;min-height:90px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:13px/1.3 ui-monospace,Menlo,monospace;padding:10px}
.row-btns{display:flex;gap:10px;margin-top:12px}
.danger{color:var(--coral)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;z-index:60;max-width:90%;text-align:center}
@media (max-height:640px){.word{font-size:32px}.face{gap:8px;padding:16px}}
@media (prefers-reduced-motion: reduce){.flame svg,.prog,.lv,.stat,.cell,.trophy,.badge.got i,.sheet{animation:none!important}.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="banners"></div>
<script src="vocab.js"></script>
<script>
(function(){
'use strict';

var V = window.VOCAB || [];
var LEVELS = [
  {n:1, name:'Essentials',         cls:'c-teal',   col:'#2cc4a8', dk:'#1a9a83'},
  {n:2, name:'Everyday life',      cls:'c-purple', col:'#7b61ff', dk:'#5a43d6'},
  {n:3, name:'Past and plans',     cls:'c-coral',  col:'#ff7a59', dk:'#d85a3a'},
  {n:4, name:'Real conversations', cls:'c-blue',   col:'#3d8bff', dk:'#2a68cc'},
  {n:5, name:'Beyond basics',      cls:'c-yellow', col:'#ffc83d', dk:'#d9a21a'}
];
var DAY = 86400000;
var INTERVALS = [0, 0, 1, 3, 7, 14, 30];
var KEY = 'espanol1000.v1';
var UNLOCK_AT = 0.75;
var LIGHTNING_SECS = 60;
var CONFETTI = ['#ffc83d', '#7b61ff', '#2cc4a8', '#ff7a59', '#3d8bff'];

/* ---------- state ---------- */
function defaults(){
  return {v:2, cards:{}, daily:{date:'', newDone:0, extra:0, goalHit:false},
    streak:{last:'', count:0}, activity:{}, badges:{},
    stats:{bestCombo:0, bestLightning:0, goalDays:0},
    settings:{newPerDay:15, dailyGoal:20, dir:'en-es', autoplay:true, rate:0.9, unlockAll:false, theme:'auto',
      sound:true, haptics:true, hideInstall:false}};
}
function normalize(s){
  var d = defaults();
  if (!s || typeof s !== 'object' || typeof s.cards !== 'object') return d;
  return {v:2, cards:s.cards || {},
    daily:Object.assign(d.daily, s.daily || {}),
    streak:Object.assign(d.streak, s.streak || {}),
    activity:s.activity || {}, badges:s.badges || {},
    stats:Object.assign(d.stats, s.stats || {}),
    settings:Object.assign(d.settings, s.settings || {})};
}
var state;
try { state = normalize(JSON.parse(localStorage.getItem(KEY))); } catch(e){ state = defaults(); }
var storageOk = true;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); storageOk = true; }
  catch(e){ storageOk = false; }
}
function pad(n){ return (n < 10 ? '0' : '') + n; }
function dstr(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function today(){ return dstr(new Date()); }
function yesterday(){ var d = new Date(); d.setDate(d.getDate()-1); return dstr(d); }
function rollDaily(){
  if (state.daily.date !== today()) { state.daily = {date:today(), newDone:0, extra:0, goalHit:false}; save(); }
}
function markActivity(){
  var t = today();
  if (state.streak.last === t) return;
  state.streak.count = (state.streak.last === yesterday()) ? state.streak.count + 1 : 1;
  state.streak.last = t;
}
function streakNow(){

  } else { cb.style.opacity = '0'; cb.style.transform = 'scale(.6)'; }
}
function gradeNow(g){
  var s = session; if (!s || !s.flipped || s.busy) return;
  s.busy = true;
  var c = s.queue.shift(), fx = el('fx'), flipEl = el('flip'), stage = el('stage');
  var cr = stage.getBoundingClientRect(), fr = fx.getBoundingClientRect();
  var cx = cr.left - fr.left + cr.width / 2, cy = cr.top - fr.top + cr.height / 2;
  var wait = 400, out;
  if (g === 'again') { s.combo = 0; s.again++; } else { s.combo++; if (s.combo > s.bestCombo) s.bestCombo = s.combo; if (s.combo > state.stats.bestCombo) state.stats.bestCombo = s.combo; if (g === 'easy') s.easy++; else s.good++; }
  if (s.mode === 'study') gradeCard(c, g);
  var goalNow = false;
  if (g !== 'again') goalNow = addActivity(1);
  if (g === 'easy') {
    sfx('easy'); buzz(20); burst(fx, cx, cy, 34, 170, 10); floatText(fx, '+1', cx, cy - 20, '#1a9a83');
    out = [{transform:'rotateY(180deg) translateY(0)', opacity:1}, {transform:'rotateY(180deg) translateY(-140%) rotate(6deg)', opacity:0}];
  } else if (g === 'good') {
    sfx('good'); buzz(12); burst(fx, cx, cy, 12, 100, 8); floatText(fx, 'Nice', cx, cy - 20, '#5a43d6');
    out = [{transform:'rotateY(180deg) translateX(0)', opacity:1}, {transform:'rotateY(180deg) translateX(-130%) rotate(-8deg)', opacity:0}];
  } else {
    sfx('again'); buzz([30, 40, 30]);
    out = [{transform:'rotateY(180deg) translateX(0)', offset:0}, {transform:'rotateY(180deg) translateX(-14px)', offset:0.15},
      {transform:'rotateY(180deg) translateX(14px)', offset:0.3}, {transform:'rotateY(180deg) translateX(-10px)', offset:0.45},
      {transform:'rotateY(180deg) translateX(10px)', offset:0.6}, {transform:'rotateY(180deg) translateX(0)', opacity:1, offset:0.75},
      {transform:'rotateY(180deg) translateY(120%)', opacity:0, offset:1}];
    wait = 650;
  }
  if (s.mode === 'lightning' && g !== 'again') s.score += 10 * (1 + Math.floor(s.combo / 5));
  comboChip();
  if (g !== 'again' && s.combo >= 2) { setTimeout(function(){ sfx('combo', s.combo); }, 120); }
  if (g !== 'again' && (s.combo === 5 || s.combo === 10 || (s.combo > 10 && s.combo % 10 === 0))) {
    burst(fx, cr.width / 2, 60, 28, 150, 9); banner('Combo x' + s.combo + '!', s.combo >= 10 ? 'You are on fire' : 'Keep it going');
  }
  if (goalNow) { s.goalHit = true; sfx('goal'); burst(fx, cr.width / 2, cy, 50, 220, 11); banner('Daily goal reached', state.settings.dailyGoal + ' cards today'); buzz([40, 40, 80]); }
  var newBadges = checkBadges();
  newBadges.forEach(function(b, i){ s.earned.push(b); setTimeout(function(){ sfx('badge'); banner('Badge unlocked: ' + b.name, b.desc); }, goalNow ? 900 + i * 700 : 300 + i * 700); });
  save();
  if (!rm() && flipEl.animate) flipEl.animate(out, {duration:wait - 40, easing:'ease-in', fill:'forwards'}); else flipEl.style.opacity = '0';
  setTimeout(function(){
    if (!session || session !== s) return;

    }

  }, wait);
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'rate' || act === 'theme') return;
  audio();
  switch (act) {
    case 'tab': view = t.getAttribute('data-v'); render(); window.scrollTo(0, 0); break;
    case 'start': startSession(0); break;
    case 'lightning': startLightning(); break;
    case 'more': rollDaily(); state.daily.extra += 5; save(); if (view === 'done') { session = null; view = 'home'; } render(); if (buildQueue(0).length) startSession(0); break;
    case 'dir': state.settings.dir = t.getAttribute('data-d'); save(); render(); break;
    case 'level':
      var n = +t.getAttribute('data-n');
      if (!unlocked(n)) { toast('Know ' + Math.round(UNLOCK_AT * 100) + '% of Level ' + (n-1) + ' to unlock this, or use Settings'); break; }
      startSession(n); break;
    case 'settings': sheet = 'settings'; renderSheet(); break;
    case 'closesheet': sheet = null; render(); break;
    case 'hideinstall': state.settings.hideInstall = true; save(); render(); break;
    case 'flip': if (!e.target.closest('.spk')) flipCard(); break;
    case 'say':
      e.stopPropagation();
      var cc = session && session.queue[0];
      if (cc) speak(t.getAttribute('data-t') === 'x' ? cc.xe : cc.es);
      break;
    case 'grade': gradeNow(t.getAttribute('data-g')); break;
    case 'quit': quitSession(); break;
    case 'home': session = null; view = 'home'; render(); break;
    case 'wlevel': wordsUI.level = +t.getAttribute('data-n'); wordsUI.limit = 60; renderWords(); break;
    case 'wfilter': wordsUI.filter = t.getAttribute('data-f'); wordsUI.limit = 60; renderWords(); break;
    case 'showmore': wordsUI.limit += 120; el('rows').innerHTML = rowsHtml(); break;
    case 'word':
      var w = byId[+t.getAttribute('data-id')];
      if (w) { speak(w.es); t.classList.toggle('open'); }
      break;
    case 'npd': state.settings.newPerDay = Math.max(5, Math.min(60, state.settings.newPerDay + (+t.getAttribute('data-d')))); save(); renderSheet(); break;
    case 'goal': state.settings.dailyGoal = Math.max(5, Math.min(100, state.settings.dailyGoal + (+t.getAttribute('data-d')))); save(); renderSheet(); break;
    case 'sound': state.settings.sound = !state.settings.sound; save(); renderSheet(); if (state.settings.sound) sfx('badge'); break;
    case 'haptics': state.settings.haptics = !state.settings.haptics; save(); renderSheet(); buzz(30); break;
    case 'autoplay': state.settings.autoplay = !state.settings.autoplay; save(); renderSheet(); break;
    case 'unlockall': state.settings.unlockAll = !state.settings.unlockAll; save(); render(); break;
    case 'backup': sheet = 'backup'; renderSheet(); break;
    case 'copybk':
      var ta = el('bk'); ta.select();
      try { navigator.clipboard.writeText(ta.value).then(function(){ toast('Copied'); }, function(){ document.execCommand('copy'); toast('Copied'); }); }
      catch(err){ try { document.execCommand('copy'); toast('Copied'); } catch(e2){ toast('Select the text and copy it manually'); } }
      break;
    case 'restore':
      try {
        var obj = JSON.parse(el('bk').value);
        if (!obj || typeof obj.cards !== 'object') throw new Error('bad');
        state = normalize(obj); save(); sheet = null; render(); toast('Progress restored');
      } catch(err){ toast('That text is not a valid backup'); }
      break;
    case 'reset': sheet = 'confirmreset'; renderSheet(); break;
    case 'doreset': var keep = state.settings; state = defaults(); state.settings = keep; save(); sheet = null; view = 'home'; render(); toast('Progress reset'); break;
  }
});
document.addEventListener('change', function(e){
  var t = e.target.closest('select[data-act]'); if (!t) return;
  var act = t.getAttribute('data-act');
  if (act === 'rate') state.settings.rate = parseFloat(t.value);
  if (act === 'theme') state.settings.theme = t.value;
  save(); applyTheme();
});
document.addEventListener('input', function(e){
  if (e.target.id === 'q') { wordsUI.q = e.target.value; wordsUI.limit = 60; el('rows').innerHTML = rowsHtml(); }
});
document.addEventListener('keydown', function(e){
  if (view !== 'study' || sheet) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flipCard(); }
  else if (e.key === '1') gradeNow('again');
  else if (e.key === '2') gradeNow('good');
  else if (e.key === '3') gradeNow(session && session.mode === 'lightning' ? 'good' : 'easy');
  else if (e.key === 'Escape') quitSession();
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden && (view === 'home' || view === 'trophies')) render(); });

/* ---------- boot ---------- */
rollDaily();
save();
render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
window.__app = {get state(){ return state; }, get session(){ return session; }};
})();
</script>
</body>
</html>
